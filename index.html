<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>M.mode.ify</title>
	<!-- Auth0 Lock script -->

<!-- Setting the right viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" type="text/css" href="style.css">
<link rel="stylesheet" type="text/css" href="flatbuttons.css">
<link rel="stylesheet" type="text/css" href="select.css">
  </head>
<body>
 <div id="splash"><span class="splashword">M.mode.ify</span></div>
 <div id="maintitle"><img src="build/logo.png" id="logo"></img><div id="copyright">&copy; 2026 Ben C. Smith, MD <a href="https://twitter.com/UltrasoundJelly" target="_blank"><i class="fa fa-twitter" aria-hidden="true"></i></a> <a href="mailto:bensmith.md@gmail.com" target="_self"><i class="fa fa-envelope" aria-hidden="true"></i></a></div></div>
	<div id="filelistwrap">
		<div id="drag">Drop your clip here</div>
	</div>
	<div id="loading-container">
    		<div id="loading-text">Generating Preview</div>
    		<div id="previewbar"><div id="previewbarfill"></div></div>
	</div>
<div id="selectlinemsg">Click to select a pivot point, then drag to select your line. <span id="lwstep">Line width <button type="button" id="lwdown" aria-label="thinner">&#9662;</button><span id="lwval">3</span> px <button type="button" id="lwup" aria-label="thicker">&#9652;</button></span></div>
<div id=myprogresswrap>
    <div id="progressmsg">creating your m.mode</div>
        <div id="myProgress">
                <div id="myBar">
                        <div id="label">0%</div>
                </div>
        </div>
        <div id="timeleft"></div>
</div>
<div id="calibratemsg">Click and drag over <select id="calcmselect"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select> cm to calibrate</div>
<div id="calibratemsgplaceholder"></div>
<div id="mmodemsg">Click and drag to measure</div>
<div id=bodywrap>
	
	<div id="selectline">
		<div id="selectlinewrap"><canvas id="selectlinecanvas"></canvas></div>
		<div id="calibratewrap"><canvas id="calibratecanvas"></canvas></div>
	</div>
	<div id="mmode">
                <div id="mmodewrap"><div id="measureresult"></div><canvas id="mmodecanvas"></canvas><ul id="slices"></ul></div>
        </div>
</div>
   <div id=sidebar>
	<button type="button" class="rightbtn btn btn-outlined btn-black btn-lg" id="calibrateok" style="display:none">OK</button>
	<button type="button" class="rightbtn btn btn-outlined btn-black btn-lg" id="selectlineok" style="display:none" >OK</button>
	<button type="button" class="leftbtn btn btn-outlined btn-black btn-lg" id="restart"  style="display:none">Start Over</button>
	<button type="button" class="leftbtn btn btn-outlined btn-black btn-lg" id="recalibrate" style="display:none">Recalibrate</button>
	<button type="button" class="leftbtn btn btn-outlined btn-black btn-lg" id="reselectline" style="display:none">Reselect Line</button>
	<button type="button" class="leftbtn btn btn-outlined btn-black btn-lg" id="save" style="display:none">Save</button>
	<div id=poster></div>
	<div id="mmodepreview"><div class="lbl">preview</div><img id="mmodepreviewimg"></div>
   </div>
	<div id=fadetoblack></div>
	
</body>
